        // HÀM TỰ ĐỘNG BÓC TÁCH MÃ ID RÚT GỌN TỪ BẤT KỲ LINK YOUTUBE NÀO
        function getYouTubeId(input) {
            if (!input) return '';
            const trimmed = input.trim();
            // Nếu người dùng chỉ nhập mỗi mã ID (11 ký tự)
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
                return trimmed;
            }
            // Nếu người dùng dán cả link YouTube
            const match = trimmed.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/)|&v=)([^#&?]*).*/);
            return (match && match[1].length === 11) ? match[1] : '';
        }

        const params = new URLSearchParams(window.location.search);
        const kdlId = params.get('id') || 'nui-than-tai';
        const data = kdlData[kdlId] || kdlData['nui-than-tai'];

        document.getElementById('page-title').innerText = `${data.name} - Du Lịch Sinh Thái Phú Túc`;

        // Kiểm tra xem có video hay không
        const ytId = getYouTubeId(data.youtubeId);

        const container = document.getElementById('detail-box');
        container.innerHTML = `
            <img src="${data.image}" alt="${data.name}" class="banner-img" loading="lazy">
            
            <div class="content">
                <span class="tag-badge">🌿 ĐIỂM ĐẾN DU LỊCH SINH THÁI</span>
                <h1 class="kdl-name">${data.name}</h1>

                <div class="meta-info-box">
                    <p>📍 <strong>Địa chỉ:</strong> ${data.address}</p>
                    <p>⏰ <strong>Thời gian hoạt động:</strong> ${data.hours}</p>
                    <p>📞 <strong>Hotline hỗ trợ:</strong> <a href="tel:${data.hotline}" style="color: #2e7d32; font-weight: bold;">${data.hotline}</a></p>
                    <p>🎟️ <strong>Chi phí tham khảo:</strong> ${data.ticket}</p>
                </div>

                <div class="action-group">
                    <a href="${data.mapLink}" target="_blank" class="btn btn-green">🗺️ Chỉ đường trên Google Maps</a>
                    ${data.website ? `<a href="${data.website}" target="_blank" class="btn btn-orange">🌐 Ghé thăm Website chính thức</a>` : ''}
                    <a href="tel:${data.hotline}" class="btn btn-outline">📞 Gọi hotline đặt chỗ</a>
                </div>

                <h2 class="section-title">Giới thiệu tổng quan</h2>
                <p class="body-desc">${data.intro}</p>

                <h2 class="section-title">Trải nghiệm & Điểm nhấn nổi bật</h2>
                <ul class="feature-list body-desc">
                    ${data.highlights.map(item => `<li>${item}</li>`).join('')}
                </ul>

                <!-- TỰ ĐỘNG HIỆN VIDEO KHI ĐIỀN MÃ YOUTUBE RÚT GỌN -->
                ${ytId ? `
                    <h2 class="section-title">Video trải nghiệm & Giới thiệu</h2>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                ` : ''}
            </div>
        `;
    </script>
