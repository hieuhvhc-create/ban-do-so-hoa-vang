<body>

    <div class="top-nav">
        <a href="am-thuc-phu-tuc.html">← Danh sách Ẩm thực Phú Túc</a>

    <div class="dish-header">
        <h1 id="name">Tên món ăn</h1>
        <p>Món ngon truyền thống của đồng bào Cơ Tu Phú Túc</p>
    </div>

    <main class="content-box">
        <img id="dish-image" src="" alt="" class="dish-img-large">

        <h2 class="section-title">Nguyên liệu chuẩn bị</h2>
        <ul id="ingredients"></ul>

        <h2 class="section-title">Cách chế biến truyền thống</h2>
        <ol id="steps"></ol>

        <h2 class="section-title" id="video-heading">Video trải nghiệm & Hướng dẫn</h2>
        <div class="video-wrapper" id="video-box"></div>
    </main>

    <footer>
        <p>Bản đồ số Di tích Lịch sử & Du lịch Xã Hòa Vang</p>
    </footer>

    <script>
        const dishData = {
            "com-lam": {
                name: "Cơm lam ống tre Phú Túc",
                thumb: "https://lh3.googleusercontent.com/d/1qb8FdsM5eYyVLVsgsHh7BMDy9wRurlHw",
                ingredients: [
                    "Gạo nếp nương thơm dẻo của đồng bào vùng cao.",
                    "Ống nứa tươi non (còn nguyên lớp màng lụa bên trong).",
                    "Lá chuối non hoặc lá dong rừng bịt đầu ống.",
                    "Nước suối nguồn trong lành."
                ],
                steps: [
                    "Vo sạch nếp rẫy, ngâm nước suối khoảng 2-4 tiếng cho mềm hạt gạo.",

                    "Dùng lá chuối non cuộn chặt bịt kín miệng ống nứa.",
                    "Đưa ống nứa lên bếp than hồng, liên tục xoay tròn đều tay để cơm chín dẻo từ ngoài vào trong.",

                ],
                youtubeId: ""
            },
            "thit-nuong-ong": {
                name: "Thịt heo nướng ống (Za-ră Cơ Tu)",
                thumb: "https://lh3.googleusercontent.com/d/19F5LwT2BiZxYvVOPB4sQ5MbwOIb3m_1o",
                ingredients: [
                    "Thịt heo cỏ/heo bản tươi ngon thái lát mỏng.",
                    "Tiêu rừng, ớt xiêm, củ kiệu hoang, muối hột.",
                    "Ống nứa tươi dày dặn còn đọng nhựa thơm."
                ],
                steps: [
                    "Thịt heo ướp cùng các loại gia vị rừng giã nhuyễn khoảng 30 phút cho ngấm sâu.",
                    "Nhồi thịt chặt vào bên trong ống nứa tươi.",
                    "Nướng ống trên than hồng rực, lật đều các mặt đến khi ống nứa xèo xèo bốc khói thơm phức là thịt chín mềm ngọt đậm đà."
                ],
                youtubeId: ""
            },
            "ca-nien": {
                name: "Cá niên nướng than hồng",
                thumb: "https://lh3.googleusercontent.com/d/1qU95gOYkNhGUPqilX2W8JohHqUnq6vFg",

                    "Cá niên suối tự nhiên còn tươi sống.",

                    "Muối hột, ớt xiêm xanh rừng giã nhuyễn."
                ],
                steps: [
                    "Cá niên rửa sạch, giữ nguyên vảy và ruột cá (ruột cá có vị đắng nhân nhẫn rất thanh và bổ).",
                    "Kẹp cá vào các nẹp nứa tươi rồi đặt trên than củi hồng rực.",
                    "Nướng đến khi vảy cá vàng giòn rụm, thịt săn lại tỏa mùi thơm đặc trưng, ăn kèm muối ớt rừng cay nồng."
                ],
                youtubeId: ""
            },
            "rau-don": {
                name: "Rau dớn rừng luộc / xào tỏi",
                thumb: "https://lh3.googleusercontent.com/d/1wvywZjcE6RLgMY6YbNPli9cYBmyxcQXv",
                ingredients: [
                    "Ngọn rau dớn rừng tươi non hái ven bờ suối.",
                    "Tỏi củ băm nhuyễn, dầu ăn hoặc mỡ heo.",
                    "Gia vị: muối hạt, ớt xiêm."
                ],
                steps: [
                    "Nhặt lấy phần đọt non uốn cong của rau dớn, rửa sạch nhẹ tay để tránh dập nát.",
                    "Trần sơ qua nước sôi để giữ màu xanh mướt và độ giòn sần sật.",
                    "Phi thơm tỏi rồi cho rau vào đảo nhanh tay trên lửa lớn, nêm chút muối là hoàn thành món rau rừng thanh mát tuyệt hảo."
                ],
                youtubeId: ""
            },
            "ruou-can": {
                name: "Rượu cần men lá Phú Túc",
                thumb: "https://lh3.googleusercontent.com/d/1ZFCkhCSu0MOes1JX_hcgTjxOl2RU6lPn",
                ingredients: [
                    "Gạo nếp nương thơm hoặc sắn rẫy phơi khô.",
                    "Men lá rừng bí truyền (kết hợp từ hơn 10 loại rễ, vỏ cây tự nhiên trên núi cao).",
                    "Vỏ trấu sạch, ché sành ủ rượu."
                ],
                steps: [
                    "Nấu chín nếp nương, xới tơi và để nguội hoàn toàn.",
                    "Giã nhỏ bánh men lá rừng, trộn thật đều cùng xôi nếp và trấu sạch.",
                    "Cho hỗn hợp vào ché sành, bịt kín miệng và ủ nơi thoáng mát từ 1 đến 3 tháng.",
                    "Khi thưởng thức, châm nước suối mát vào ché rồi cắm cần tre để mọi người cùng vít cần nâng chén sum vầy."
                ],
                youtubeId: ""
            },
            "banh-sung-trau": {
                name: "Bánh sừng trâu (Kuốc)",
                thumb: "https://lh3.googleusercontent.com/d/16b4d3nFYXfDL2iBkrZsB4QhBzc_9w6Jc",
                ingredients: [
                    "Gạo nếp rẫy dẻo thơm.",
                    "Lá đót rừng xanh hái trên sườn núi Trường Sơn.",
                    "Lạt giang mềm buộc bánh."
                ],
                steps: [
                    "Lá đót lau sạch, khéo léo cuộn thành hình chóp nón tựa như chiếc sừng trâu kiên cường.",
                    "Đổ gạo nếp đã ngâm vào trong ruột lá rồi gập kín mép lại.",
                    "Dùng lạt mềm buộc thành từng cặp dính liền nhau biểu trưng cho sự hòa hợp âm dương.",
                    "Cho bánh vào nồi luộc liên tục 3-4 tiếng cho đến khi bánh dẻo rền thơm hương lá rừng."
                ],
                youtubeId: ""
            },
            "oc-da-suoi": {
                name: "Ốc đá suối xào sả ớt rừng",
                thumb: "https://lh3.googleusercontent.com/d/115ij-XzePBzYYfRoAJ9LkBmbTnZmCPz8",
                ingredients: [
                    "Ốc đá bắt tại các khe suối tự nhiên trên rừng Phú Túc.",
                    "Sả củ tươi, ớt hiểm xanh giã giập.",
                    "Lá lốt hoặc lá chanh xắt sợi chỉ.",
                    "Gia vị: muối hột, nước mắm, tiêu rừng."
                ],
                steps: [
                    "Ốc đá ngâm nước vo gạo hoặc nước pha ớt vài tiếng cho nhả sạch nhớt rêu, rửa sạch vỏ ngoài.",
                    "Dùng kìm bấm bỏ phần chóp nhọn của đuôi ốc để ngấm gia vị và dễ hút khi ăn.",
                    "Phi thơm sả băm và ớt giã giập trong chảo dầu nóng.",
                    "Trút ốc vào đảo đều tay trên lửa lớn, nêm gia vị vừa miệng.",
                    "Xào 5-7 phút cho thịt ốc săn giòn lại, rắc thêm lá lốt thái chỉ vào rồi thưởng thức nóng hổi."
                ],
                youtubeId: ""
            },
            "la-san-xao-top-mo": {
                name: "Lá sắn xào tóp mỡ vùng cao",
                thumb: "https://lh3.googleusercontent.com/d/19y_JmuU5Nc3HWbzUUqdkf1kWIjZlBs_8",
                ingredients: [
                    "Búp và đọt non của cây sắn rẫy (sắn mì ta).",
                    "Mỡ heo tươi thắng lấy tóp mỡ vàng giòn ráo dầu.",
                    "Tỏi băm nhuyễn, ớt hiểm tươi.",
                    "Gia vị: muối hạt, hạt nêm, tiêu rừng."
                ],
                steps: [
                    "Hái những đọt sắn non mướt, rửa sạch rồi dùng tay vò thật kỹ hoặc giã nhẹ cho dập lá, ra bớt nhựa chát.",
                    "Luộc sơ lá sắn qua nước sôi rồi vớt ra xả nước lạnh, vắt thật ráo.",
                    "Phi thơm tỏi ớt với chút mỡ heo rồi trút lá sắn vào xào đều tay trên lửa vừa, nêm nếm gia vị.",
                    "Cuối cùng cho phần tóp mỡ giòn rụm vào đảo nhanh tay 1-2 phút cho bóng mượt rồi tắt bếp. Vị bùi đắng dịu hòa quyện vị béo giòn cực kỳ đưa cơm."
                ],
                youtubeId: ""
            }
        };

        const params = new URLSearchParams(window.location.search);
        const dishId = params.get('id');
        const dish = dishData[dishId];

        if (dish) {
            document.title = dish.name + " - Ẩm thực Phú Túc";
            document.getElementById("name").innerText = dish.name;
            document.getElementById("dish-image").src = dish.thumb;
            document.getElementById("dish-image").alt = dish.name;
            document.getElementById("ingredients").innerHTML = dish.ingredients.map(i => `<li>${i}</li>`).join('');
            document.getElementById("steps").innerHTML = dish.steps.map(s => `<li>${s}</li>`).join('');

            if (dish.youtubeId && dish.youtubeId.trim() !== "") {
                document.getElementById("video-box").innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${dish.youtubeId}?rel=0" allowfullscreen></iframe>
                `;
            } else {
                document.getElementById("video-heading").style.display = "none";
                document.getElementById("video-box").style.display = "none";
            }
        } else {
            document.getElementById("name").innerText = "Không tìm thấy món ăn";
            document.querySelector(".content-box").innerHTML = "<p style='text-align:center; padding: 20px;'>Món ăn không tồn tại hoặc đã được cập nhật lại.</p>";
        }
    </script>
</body>
</html>
