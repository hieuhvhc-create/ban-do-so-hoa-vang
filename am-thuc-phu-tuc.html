<!DOCTYPE html>
<html lang="vi">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZHXVRX7XZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VZHXVRX7XZ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ẩm thực Truyền thống Cơ Tu Phú Túc - Hòa Vang</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .cuisine-hero {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('images/bg-am-thuc.jpg') center/cover;
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 40px 15px;
        }
        .cuisine-hero h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .cuisine-hero p {
            font-size: 0.95rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-back-bar {
            background: #e8f5e9;
            padding: 10px 15px;
            text-align: center;
            border-bottom: 1px solid #c8e6c9;
        }
        .nav-back-bar a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .food-grid {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .food-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .food-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }
        .food-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #e0e0e0;
        }
        .food-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .food-info h3 {
            margin: 0 0 8px 0;
            color: #2e7d32;
            font-size: 1.2rem;
        }
        .food-info p {
            font-size: 0.88rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
            flex: 1;
        }
        .btn-recipe {
            display: block;
            text-align: center;
            background: #2e7d32;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-recipe:hover {
            background: #1b5e20;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            margin-top: 40px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="cuisine-hero">
        <h1>ẨM THỰC TRUYỀN THỐNG CƠ TU</h1>
        <p>Hương vị núi rừng Phú Túc – Hòa Vang kết tinh từ men lá, nếp nương và thảo mộc đại ngàn</p>
    </div>

    <div class="nav-back-bar">
        <a href="du-lich-phu-tuc.html">← Quay lại Bản đồ số Du lịch Phú Túc</a>
    </div>

    <main class="food-grid" id="foodGrid">
        <!-- Danh sách các món ăn hiển thị bằng JS -->
    </main>

    <footer>
        <p><strong>Bản đồ số Di tích & Du lịch sinh thái cộng đồng Xã Hòa Vang</strong></p>
        <p>Công trình Chuyển đổi số thanh niên</p>
    </footer>

    <script>
        const dishes = [
            {
                id: "com-lam",
                name: "Cơm lam ống tre",
                desc: "Gạo nếp rẫy thơm dẻo nấu trong ống nứa tươi trên than hồng, thoang thoảng hương thơm thanh khiết của nứa rừng non.",
                thumb: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=60" // Thay bằng link ảnh của bạn
            },
            {
                id: "thit-nuong-ong",
                name: "Thịt heo nướng ống (Za-ră)",
                desc: "Món ăn đặc sản độc đáo của người Cơ Tu: thịt ướp ớt tiêu rừng, nhồi ống nứa rồi nướng chín thơm ngậy.",
                thumb: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600&auto=format&fit=crop&q=60"
            },
            {
                id: "ca-nien",
                name: "Cá niên nướng than hồng",
                desc: "Cá niên suối tươi rói nướng giòn trên than củi, chấm cùng muối hột ớt hiểm thơm lừng và đậm đà vị ngọt bùi.",
                thumb: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=600&auto=format&fit=crop&q=60"
            },
            {
                id: "rau-don",
                name: "Rau dớn rừng xào tỏi / luộc",
                desc: "Rau dớn hái bên bờ suối đầu nguồn mát rượi, giòn ngọt tự nhiên, món ăn thanh mát giải nhiệt đặc trưng vùng cao.",
                thumb: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&auto=format&fit=crop&q=60"
            },
            {
                id: "ruou-can",
                name: "Rượu cần men lá Phú Túc",
                desc: "Ủ từ gạo nếp nương cùng men vỏ cây, rễ thảo mộc rừng; men say dịu êm gắn kết buôn làng bên bếp lửa bập bùng.",
                thumb: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=600&auto=format&fit=crop&q=60"
            },
            {
                id: "banh-sung-trau",
                name: "Bánh sừng trâu (Kuốc)",
                desc: "Bánh truyền thống dâng cúng tổ tiên trong các ngày hội cồng chiêng, gói bằng lá đót tạo hình đôi sừng trâu kiên cường.",
                thumb: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=60"
            }
        ];

        const container = document.getElementById("foodGrid");
        container.innerHTML = dishes.map(item => `
            <div class="food-card">
                <img src="${item.thumb}" alt="${item.name}" class="food-thumb">
                <div class="food-info">
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <a href="chi-tiet-mon-an.html?id=${item.id}" class="btn-recipe">
                        📖 Xem cách chế biến & Video ▶
                    </a>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
